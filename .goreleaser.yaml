version: 2

project_name: goldmark-lint

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/goldmark-lint
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

# Record what went into each archive so consumers can scan releases for known
# vulnerabilities without unpacking and guessing at the dependency set.
sboms:
  - artifacts: archive

# Sign the checksum file with cosign in keyless mode: the signing identity is
# the GitHub Actions OIDC token for this workflow, so no private key has to be
# held anywhere. Signing the checksums covers every archive it lists.
#
# cosign v3 writes the certificate and signature together into one bundle;
# the older --output-certificate/--output-signature pair is rejected outright
# ("must specify --bundle with --new-bundle-format").
#
# Verify a download with:
#
#	cosign verify-blob \\
#	  --bundle checksums.txt.bundle \\
#	  --certificate-identity-regexp 'https://github.com/mrueg/goldmark-lint/.*' \\
#	  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
#	  checksums.txt
signs:
  - cmd: cosign
    signature: "${artifact}.bundle"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    artifacts: checksum
    output: true

homebrew_casks:
  - repository:
      owner: mrueg
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/mrueg/goldmark-lint"
    description: "A Markdown linter written in Go using the goldmark parser"
    license: "MIT"
    commit_author:
      name: Manuel Rüger
      email: manuel@rueg.eu
    commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"
    directory: Casks
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/goldmark-lint"]
          end

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
