name: Benchmark

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  bench:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: false

      # The corpora are pinned to fixed commits, so this key never changes and
      # the clone happens once for the life of the cache rather than per run.
      - name: Cache benchmark corpora
        uses: actions/cache@v6
        with:
          path: |
            bench/rfcs
            bench/tldr
          key: bench-corpora-rfcs-c143e315-tldr-05c563d1

      # markdownlint-cli2 is only installed when the full comparison is wanted.
      # bench.sh detects its absence and benchmarks goldmark-lint alone, which
      # is what a pull request needs: markdownlint's speed is a fixed external
      # baseline that no change to this repository can move, and re-measuring it
      # is ~95% of the job's runtime.
      - uses: actions/setup-node@v7
        if: github.event_name != 'pull_request'
        with:
          node-version: lts/*
      - name: Install markdownlint-cli2 (comparison runs only)
        if: github.event_name != 'pull_request'
        run: npm install -g markdownlint-cli2

      - name: Install hyperfine
        run: |
          wget -q https://github.com/sharkdp/hyperfine/releases/download/v1.20.0/hyperfine_1.20.0_amd64.deb
          echo "e0391897ffb490af8a6b64e0e4281ac2c8e10cbcbb875bd22a376f44cdb263ab  hyperfine_1.20.0_amd64.deb" | sha256sum --check
          sudo dpkg -i hyperfine_1.20.0_amd64.deb

      # Run count is unchanged. Ten runs of goldmark-lint cost seconds, and
      # cutting them would only widen the confidence interval on the number the
      # job exists to watch.
      - name: Run benchmarks (no cache)
        run: ./bench/bench.sh --no-cache
