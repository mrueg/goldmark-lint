name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - run: go test ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - uses: golangci/golangci-lint-action@v9
      # Belt and braces: golangci-lint reports formatting drift via the
      # formatters section of .golangci.yml, but this step names the offending
      # files and shows the diff directly in the log.
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l . | grep -v '^bench/' || true)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted. Run: gofmt -w ."
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

  self-lint:
    name: Self-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      # Lint this repository's own Markdown with the linter being built. A
      # change that makes goldmark-lint wrong about a real document fails here
      # rather than reaching users.
      #
      # The file list comes from git rather than a glob so that testdata/, which
      # holds deliberately malformed fixtures, is excluded without an "ignores"
      # entry in .markdownlint-cli2.yaml — that config is auto-discovered by the
      # CLI tests too, and excluding testdata there made them lint nothing.
      - name: Lint own Markdown
        run: go run ./cmd/goldmark-lint --no-cache $(git ls-files '*.md' ':!:testdata/*')

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      # The snapshot build now produces SBOMs, so syft has to be present for it
      # to be a faithful rehearsal of the release.
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v7
        with:
          # Signing is skipped: it needs the OIDC identity that only the
          # release workflow is granted. Everything else runs as it will on a tag.
          args: release --snapshot --clean --skip=ko --skip=sign

  conform:
    name: Conformance
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2
      - name: Run conformance test
        run: ./bench/conform.sh
