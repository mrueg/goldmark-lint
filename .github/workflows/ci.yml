name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - run: go test ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - uses: golangci/golangci-lint-action@v9
      # Belt and braces: golangci-lint reports formatting drift via the
      # formatters section of .golangci.yml, but this step names the offending
      # files and shows the diff directly in the log.
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l . | grep -v '^bench/' || true)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted. Run: gofmt -w ."
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - uses: goreleaser/goreleaser-action@v7
        with:
          args: release --snapshot --clean --skip=ko

  conform:
    name: Conformance
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2
      - name: Run conformance test
        run: ./bench/conform.sh
